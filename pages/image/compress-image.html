<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
text-align:center;
}

img{
max-width:100%;
max-height:300px;
margin-top:20px;
display:none;
}
</style>

</head>

<body>

<div class="box">

<h1>🖼 Compress Image</h1>

<p>Choose an image and compress it.</p>

<input type="file" id="image" class="form-control" accept="image/*">

<img id="preview">

<label class="mt-3">Quality</label>

<input
type="range"
id="quality"
class="form-range"
min="10"
max="100"
value="80">

<p id="value">80%</p>

<button
id="compress"
class="btn btn-primary">

Compress

</button>

<br><br>

<a
id="download"
class="btn btn-success d-none">

Download Image

</a>

<br><br>

<a href="../../index.html" class="btn btn-secondary">

⬅ Back Home

</a>

</div>

<script>

const input=document.getElementById("image");
const preview=document.getElementById("preview");
const quality=document.getElementById("quality");
const value=document.getElementById("value");
const button=document.getElementById("compress");
const download=document.getElementById("download");

let img=new Image();

quality.oninput=function(){
value.innerHTML=this.value+"%";
}

input.onchange=function(){

const file=input.files[0];

if(!file)return;

preview.src=URL.createObjectURL(file);

preview.style.display="block";

img.src=preview.src;

}

button.onclick=function(){

if(!input.files[0]){
alert("Choose an image");
return;
}

const canvas=document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0);

download.href=canvas.toDataURL(
"image/jpeg",
quality.value/100
);

download.download="compressed.jpg";

download.classList.remove("d-none");

}

</script>

</body>
</html>
