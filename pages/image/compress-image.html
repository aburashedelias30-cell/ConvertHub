<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-compress text-primary display-4 mb-2"></i>
<h2 class="fw-bold">Compress Image File Size</h2>
<p class="text-muted">Reduce image size dramatically with custom quality sliders and instant preview.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-image"></i>
<h5 class="fw-bold">Drag & Drop an image here</h5>
<p class="text-muted small">or click to browse JPG, PNG, WEBP</p>
<input type="file" id="image" accept="image/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="compressOptions" class="card p-3 mb-4 d-none">
<label for="qualityRange" class="form-label fw-bold d-flex justify-content-between">
<span>Compression Quality Level:</span>
<span id="qualityVal" class="text-primary">80%</span>
</label>
<input type="range" class="form-range" id="qualityRange" min="10" max="95" value="80">
</div>

<div class="d-grid gap-2">
<button id="compress" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-compress me-2"></i> Compress Image
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Compressed Image
</a>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5 id="sizeInfo">Compressed Image Preview:</h5>
<img id="previewImg" class="img-fluid rounded mx-auto mt-2" style="max-height:300px; object-fit:contain;">
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "image", "fileList");

const imageInput = document.getElementById("image");
const compressBtn = document.getElementById("compress");
const downloadBtn = document.getElementById("download");
const compressOptions = document.getElementById("compressOptions");
const qualityRange = document.getElementById("qualityRange");
const qualityVal = document.getElementById("qualityVal");
const previewCard = document.getElementById("previewCard");
const previewImg = document.getElementById("previewImg");
const sizeInfo = document.getElementById("sizeInfo");
const statusAlert = document.getElementById("statusAlert");

qualityRange.oninput = () => {
    qualityVal.innerText = qualityRange.value + "%";
};

imageInput.addEventListener("change", () => {
    if (imageInput.files.length === 0) return;
    compressOptions.classList.remove("d-none");
    compressBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    previewCard.classList.add("d-none");
    statusAlert.innerHTML = "";
});

compressBtn.onclick = () => {
    const file = imageInput.files[0];
    if (!file) return;

    compressBtn.disabled = true;
    compressBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Compressing...`;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            const quality = parseInt(qualityRange.value) / 100;
            const compressedUrl = canvas.toDataURL("image/jpeg", quality);

            // Calculate compressed size
            const head = 'data:image/jpeg;base64,';
            const imgFileSize = Math.round((compressedUrl.length - head.length) * 3 / 4);

            previewImg.src = compressedUrl;
            sizeInfo.innerText = `Compressed Preview (${(imgFileSize / 1024).toFixed(1)} KB):`;
            previewCard.classList.remove("d-none");

            downloadBtn.href = compressedUrl;
            downloadBtn.download = "compressed_" + file.name.replace(/\.[^/.]+$/, ".jpg");
            downloadBtn.classList.remove("d-none");

            const origKB = (file.size / 1024).toFixed(1);
            const compKB = (imgFileSize / 1024).toFixed(1);
            statusAlert.innerHTML = `<div class="alert alert-success">Compressed! Original: ${origKB} KB → New: ${compKB} KB (${Math.round((1 - imgFileSize/file.size)*100)}% smaller).</div>`;
            compressBtn.disabled = false;
            compressBtn.innerHTML = `<i class="fa-solid fa-compress me-2"></i> Compress Image`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
