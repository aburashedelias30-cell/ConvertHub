<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resize Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
    padding:40px;
}

.box{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
    text-align:center;
}

img{
    max-width:100%;
    margin-top:20px;
    display:none;
}
</style>

</head>
<body>

<div class="box">

<h1>🖼 Resize Image</h1>

<p>Select an image and choose a new size.</p>

<input type="file" id="image" class="form-control" accept="image/*">

<div class="row mt-3">
<div class="col">
<input type="number" id="width" class="form-control" placeholder="Width">
</div>

<div class="col">
<input type="number" id="height" class="form-control" placeholder="Height">
</div>
</div>

<img id="preview">

<br>

<button class="btn btn-primary mt-3" id="resize">
Resize
</button>

<br><br>

<a id="download" class="btn btn-success d-none">
Download Image
</a>

<br><br>

<a href="../../index.html" class="btn btn-secondary">
⬅ Back Home
</a>

</div>

<script>

const input=document.getElementById("image");
const preview=document.getElementById("preview");
const widthInput=document.getElementById("width");
const heightInput=document.getElementById("height");
const button=document.getElementById("resize");
const download=document.getElementById("download");

let img=new Image();

input.onchange=function(){

const file=input.files[0];

if(!file)return;

preview.src=URL.createObjectURL(file);
preview.style.display="block";

img.onload=function(){
widthInput.value=img.width;
heightInput.value=img.height;
}

img.src=preview.src;

}

button.onclick=function(){

if(!input.files[0]){
alert("Choose an image first");
return;
}

const canvas=document.createElement("canvas");

canvas.width=Number(widthInput.value);
canvas.height=Number(heightInput.value);

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,canvas.width,canvas.height);

download.href=canvas.toDataURL("image/png");
download.download="resized-image.png";
download.classList.remove("d-none");

}

</script>

</body>
</html>
