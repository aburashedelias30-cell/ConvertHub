<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resize Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-expand text-primary display-4 mb-2"></i>
<h2 class="fw-bold">Resize Image Dimensions</h2>
<p class="text-muted">Resize image width and height in pixels while locking or unlocking aspect ratio.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-image"></i>
<h5 class="fw-bold">Drag & Drop an image here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="image" accept="image/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="resizeOptions" class="card p-3 mb-4 d-none">
<div class="row g-3 align-items-center">
<div class="col-md-5">
<label for="widthInput" class="form-label fw-bold">Width (px):</label>
<input type="number" id="widthInput" class="form-control" placeholder="Width">
</div>
<div class="col-md-2 text-center pt-4">
<div class="form-check form-switch d-inline-block">
<input class="form-check-input" type="checkbox" id="aspectRatioLock" checked>
<label class="form-check-label small" for="aspectRatioLock">Lock Ratio</label>
</div>
</div>
<div class="col-md-5">
<label for="heightInput" class="form-label fw-bold">Height (px):</label>
<input type="number" id="heightInput" class="form-control" placeholder="Height">
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="resize" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-expand me-2"></i> Resize Image
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Resized Image
</a>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5 id="dimensionsInfo">Resized Preview:</h5>
<img id="previewImg" class="img-fluid rounded mx-auto mt-2" style="max-height:300px; object-fit:contain;">
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "image", "fileList");

const imageInput = document.getElementById("image");
const resizeBtn = document.getElementById("resize");
const downloadBtn = document.getElementById("download");
const resizeOptions = document.getElementById("resizeOptions");
const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const aspectRatioLock = document.getElementById("aspectRatioLock");
const previewCard = document.getElementById("previewCard");
const previewImg = document.getElementById("previewImg");
const dimensionsInfo = document.getElementById("dimensionsInfo");
const statusAlert = document.getElementById("statusAlert");

let originalWidth = 0;
let originalHeight = 0;

imageInput.addEventListener("change", () => {
    if (imageInput.files.length === 0) return;
    const file = imageInput.files[0];
    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            originalWidth = img.width;
            originalHeight = img.height;
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;

            resizeOptions.classList.remove("d-none");
            resizeBtn.disabled = false;
            downloadBtn.classList.add("d-none");
            previewCard.classList.add("d-none");
            statusAlert.innerHTML = "";
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
});

widthInput.addEventListener("input", () => {
    if (aspectRatioLock.checked && originalWidth > 0) {
        const ratio = originalHeight / originalWidth;
        heightInput.value = Math.round(widthInput.value * ratio);
    }
});

heightInput.addEventListener("input", () => {
    if (aspectRatioLock.checked && originalHeight > 0) {
        const ratio = originalWidth / originalHeight;
        widthInput.value = Math.round(heightInput.value * ratio);
    }
});

resizeBtn.onclick = () => {
    const file = imageInput.files[0];
    if (!file) return;

    const newW = parseInt(widthInput.value);
    const newH = parseInt(heightInput.value);

    if (isNaN(newW) || isNaN(newH) || newW <= 0 || newH <= 0) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please enter valid width and height numbers.</div>`;
        return;
    }

    resizeBtn.disabled = true;
    resizeBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Resizing...`;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = newW;
            canvas.height = newH;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, newW, newH);

            const mime = file.type || "image/png";
            const resizedUrl = canvas.toDataURL(mime, 0.95);

            previewImg.src = resizedUrl;
            dimensionsInfo.innerText = `Resized Preview (${newW} × ${newH} px):`;
            previewCard.classList.remove("d-none");

            downloadBtn.href = resizedUrl;
            downloadBtn.download = "resized_" + file.name;
            downloadBtn.classList.remove("d-none");

            statusAlert.innerHTML = `<div class="alert alert-success">Resized image to ${newW} × ${newH} px successfully!</div>`;
            resizeBtn.disabled = false;
            resizeBtn.innerHTML = `<i class="fa-solid fa-expand me-2"></i> Resize Image`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
