<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-file-pdf text-primary display-4 mb-2"></i>
<h2 class="fw-bold">Image to PDF Converter</h2>
<p class="text-muted">Convert multiple images into a professional, printable PDF document.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-images"></i>
<h5 class="fw-bold">Drag & Drop images here</h5>
<p class="text-muted small">or click to browse JPG, PNG, WEBP files</p>
<input type="file" id="images" accept="image/*" multiple class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div class="d-grid gap-2">
<button id="convert" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-file-pdf me-2"></i> Convert Images to PDF
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download PDF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "images", "fileList");

const imagesInput = document.getElementById("images");
const convertBtn = document.getElementById("convert");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");

imagesInput.addEventListener("change", () => {
    convertBtn.disabled = imagesInput.files.length === 0;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

convertBtn.onclick = async () => {
    const files = imagesInput.files;
    if (files.length === 0) return;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Generating PDF...`;
    statusAlert.innerHTML = "";

    try {
        const pdfDoc = await PDFLib.PDFDocument.create();

        for (const file of files) {
            let image;
            if (file.type === "image/png") {
                try {
                    const bytes = await file.arrayBuffer();
                    image = await pdfDoc.embedPng(bytes);
                } catch(e) {
                    image = await convertImageToJpgEmbed(pdfDoc, file);
                }
            } else if (file.type === "image/jpeg" || file.type === "image/jpg") {
                try {
                    const bytes = await file.arrayBuffer();
                    image = await pdfDoc.embedJpg(bytes);
                } catch(e) {
                    image = await convertImageToJpgEmbed(pdfDoc, file);
                }
            } else {
                image = await convertImageToJpgEmbed(pdfDoc, file);
            }

            const page = pdfDoc.addPage([image.width, image.height]);
            page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
        }

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: "application/pdf" });

        downloadBtn.href = URL.createObjectURL(blob);
        downloadBtn.download = "images_doc.pdf";
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">Successfully generated PDF from ${files.length} image(s)!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">PDF generation error: ${err.message}</div>`;
    } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="fa-solid fa-file-pdf me-2"></i> Convert Images to PDF`;
    }
};

function convertImageToJpgEmbed(pdfDoc, file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => {
            img.onload = async () => {
                try {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob(async (blob) => {
                        const bytes = await blob.arrayBuffer();
                        const embedded = await pdfDoc.embedJpg(bytes);
                        resolve(embedded);
                    }, "image/jpeg", 0.95);
                } catch(err) { reject(err); }
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
</script>
</body>
</html>
