<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
text-align:center;
}

img{
max-width:100%;
max-height:300px;
display:none;
margin-top:20px;
}
</style>

</head>
<body>

<div class="box">

<h1>💧 Watermark Image</h1>

<p>Add text watermark to your image.</p>

<input type="file" id="image" class="form-control" accept="image/*">

<input
type="text"
id="text"
class="form-control mt-3"
placeholder="Watermark text">

<img id="preview">

<br>

<button id="watermark" class="btn btn-primary mt-3">
Add Watermark
</button>

<br><br>

<a id="download" class="btn btn-success d-none">
Download Image
</a>

<br><br>

<a href="../../index.html" class="btn btn-secondary">
⬅ Back Home
</a>

</div>

<script>

const input=document.getElementById("image");
const preview=document.getElementById("preview");
const button=document.getElementById("watermark");
const download=document.getElementById("download");
const text=document.getElementById("text");

let img=new Image();

input.onchange=function(){

const file=input.files[0];

if(!file)return;

preview.src=URL.createObjectURL(file);
preview.style.display="block";

img.src=preview.src;

}

button.onclick=function(){

if(!input.files[0]){
alert("Choose an image");
return;
}

const canvas=document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0);

ctx.font="40px Arial";
ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.textAlign="center";
ctx.fillText(text.value||"ConvertHub",canvas.width/2,canvas.height-30);

download.href=canvas.toDataURL("image/png");
download.download="watermarked.png";
download.classList.remove("d-none");

}

</script>

</body>
</html>
