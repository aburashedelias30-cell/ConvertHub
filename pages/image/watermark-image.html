<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-droplet text-primary display-4 mb-2"></i>
<h2 class="fw-bold">Watermark Image</h2>
<p class="text-muted">Add custom text watermarks, copyright stamps, or logos to your photos.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-image"></i>
<h5 class="fw-bold">Drag & Drop an image here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="image" accept="image/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="watermarkOptions" class="card p-3 mb-4 d-none">
<div class="row g-3">
<div class="col-md-6">
<label for="watermarkText" class="form-label fw-bold">Watermark Text:</label>
<input type="text" id="watermarkText" class="form-control" value="© ConvertHub 2026">
</div>
<div class="col-md-3">
<label for="fontSize" class="form-label fw-bold">Font Size (px):</label>
<input type="number" id="fontSize" class="form-control" value="36">
</div>
<div class="col-md-3">
<label for="textColor" class="form-label fw-bold">Color:</label>
<input type="color" id="textColor" class="form-control form-control-color w-100" value="#ffffff">
</div>
<div class="col-md-6">
<label for="position" class="form-label fw-bold">Position:</label>
<select id="position" class="form-select">
<option value="bottom-right">Bottom Right</option>
<option value="center">Center</option>
<option value="top-left">Top Left</option>
<option value="bottom-left">Bottom Left</option>
<option value="top-right">Top Right</option>
</select>
</div>
<div class="col-md-6">
<label for="opacityRange" class="form-label fw-bold d-flex justify-content-between">
<span>Opacity:</span>
<span id="opacityVal" class="text-primary">70%</span>
</label>
<input type="range" class="form-range" id="opacityRange" min="10" max="100" value="70">
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="applyWatermark" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-droplet me-2"></i> Apply Watermark
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Watermarked Image
</a>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5>Watermarked Preview:</h5>
<img id="previewImg" class="img-fluid rounded mx-auto mt-2" style="max-height:350px; object-fit:contain;">
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "image", "fileList");

const imageInput = document.getElementById("image");
const applyWatermarkBtn = document.getElementById("applyWatermark");
const downloadBtn = document.getElementById("download");
const watermarkOptions = document.getElementById("watermarkOptions");
const watermarkText = document.getElementById("watermarkText");
const fontSize = document.getElementById("fontSize");
const textColor = document.getElementById("textColor");
const position = document.getElementById("position");
const opacityRange = document.getElementById("opacityRange");
const opacityVal = document.getElementById("opacityVal");
const previewCard = document.getElementById("previewCard");
const previewImg = document.getElementById("previewImg");
const statusAlert = document.getElementById("statusAlert");

opacityRange.oninput = () => { opacityVal.innerText = opacityRange.value + "%"; };

imageInput.addEventListener("change", () => {
    if (imageInput.files.length === 0) return;
    watermarkOptions.classList.remove("d-none");
    applyWatermarkBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    previewCard.classList.add("d-none");
    statusAlert.innerHTML = "";
});

applyWatermarkBtn.onclick = () => {
    const file = imageInput.files[0];
    if (!file) return;

    applyWatermarkBtn.disabled = true;
    applyWatermarkBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Watermarking...`;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            const text = watermarkText.value || "";
            const fSize = parseInt(fontSize.value) || 30;
            const pos = position.value;
            const opacity = parseInt(opacityRange.value) / 100;

            ctx.globalAlpha = opacity;
            ctx.font = `bold ${fSize}px sans-serif`;
            ctx.fillStyle = textColor.value;

            const textWidth = ctx.measureText(text).width;
            let x = 30;
            let y = fSize + 20;

            if (pos === "bottom-right") {
                x = canvas.width - textWidth - 30;
                y = canvas.height - 30;
            } else if (pos === "center") {
                x = (canvas.width - textWidth) / 2;
                y = (canvas.height + fSize) / 2;
            } else if (pos === "top-right") {
                x = canvas.width - textWidth - 30;
                y = fSize + 30;
            } else if (pos === "bottom-left") {
                x = 30;
                y = canvas.height - 30;
            }

            ctx.fillText(text, x, y);

            const resultUrl = canvas.toDataURL(file.type || "image/png", 0.95);

            previewImg.src = resultUrl;
            previewCard.classList.remove("d-none");

            downloadBtn.href = resultUrl;
            downloadBtn.download = "watermarked_" + file.name;
            downloadBtn.classList.remove("d-none");

            statusAlert.innerHTML = `<div class="alert alert-success">Watermark applied successfully!</div>`;
            applyWatermarkBtn.disabled = false;
            applyWatermarkBtn.innerHTML = `<i class="fa-solid fa-droplet me-2"></i> Apply Watermark`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
