<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-crop text-primary display-4 mb-2"></i>
<h2 class="fw-bold">Crop Image</h2>
<p class="text-muted">Crop photos to exact proportions or custom aspect ratio presets.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-image"></i>
<h5 class="fw-bold">Drag & Drop an image here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="image" accept="image/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="cropOptions" class="card p-3 mb-4 d-none">
<div class="row g-3">
<div class="col-md-6">
<label for="aspectPreset" class="form-label fw-bold">Aspect Ratio Preset:</label>
<select id="aspectPreset" class="form-select">
<option value="free">Freeform / Custom</option>
<option value="1:1">Square (1:1)</option>
<option value="16:9">Widescreen (16:9)</option>
<option value="4:3">Standard (4:3)</option>
<option value="3:2">Photo (3:2)</option>
</select>
</div>
<div class="col-md-3">
<label for="cropX" class="form-label fw-bold">X Offset (%):</label>
<input type="number" id="cropX" class="form-control" value="10" min="0" max="90">
</div>
<div class="col-md-3">
<label for="cropY" class="form-label fw-bold">Y Offset (%):</label>
<input type="number" id="cropY" class="form-control" value="10" min="0" max="90">
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="crop" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-crop me-2"></i> Crop Image
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Cropped Image
</a>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5>Cropped Result Preview:</h5>
<img id="previewImg" class="img-fluid rounded mx-auto mt-2" style="max-height:350px; object-fit:contain;">
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "image", "fileList");

const imageInput = document.getElementById("image");
const cropBtn = document.getElementById("crop");
const downloadBtn = document.getElementById("download");
const cropOptions = document.getElementById("cropOptions");
const aspectPreset = document.getElementById("aspectPreset");
const cropX = document.getElementById("cropX");
const cropY = document.getElementById("cropY");
const previewCard = document.getElementById("previewCard");
const previewImg = document.getElementById("previewImg");
const statusAlert = document.getElementById("statusAlert");

imageInput.addEventListener("change", () => {
    if (imageInput.files.length === 0) return;
    cropOptions.classList.remove("d-none");
    cropBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    previewCard.classList.add("d-none");
    statusAlert.innerHTML = "";
});

cropBtn.onclick = () => {
    const file = imageInput.files[0];
    if (!file) return;

    cropBtn.disabled = true;
    cropBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Cropping...`;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            const origW = img.width;
            const origH = img.height;

            const offsetX = (parseInt(cropX.value) || 0) / 100 * origW;
            const offsetY = (parseInt(cropY.value) || 0) / 100 * origH;

            let targetW = origW - offsetX;
            let targetH = origH - offsetY;

            const preset = aspectPreset.value;
            if (preset === "1:1") {
                const side = Math.min(targetW, targetH);
                targetW = side;
                targetH = side;
            } else if (preset === "16:9") {
                targetH = targetW * (9 / 16);
            } else if (preset === "4:3") {
                targetH = targetW * (3 / 4);
            } else if (preset === "3:2") {
                targetH = targetW * (2 / 3);
            }

            const canvas = document.createElement("canvas");
            canvas.width = Math.round(targetW);
            canvas.height = Math.round(targetH);
            const ctx = canvas.getContext("2d");

            ctx.drawImage(img, offsetX, offsetY, targetW, targetH, 0, 0, canvas.width, canvas.height);

            const croppedUrl = canvas.toDataURL(file.type || "image/png", 0.95);

            previewImg.src = croppedUrl;
            previewCard.classList.remove("d-none");

            downloadBtn.href = croppedUrl;
            downloadBtn.download = "cropped_" + file.name;
            downloadBtn.classList.remove("d-none");

            statusAlert.innerHTML = `<div class="alert alert-success">Image cropped to ${canvas.width} × ${canvas.height} px!</div>`;
            cropBtn.disabled = false;
            cropBtn.innerHTML = `<i class="fa-solid fa-crop me-2"></i> Crop Image`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
