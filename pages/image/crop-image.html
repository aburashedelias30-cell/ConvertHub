<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Image - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
text-align:center;
}

img{
max-width:100%;
max-height:300px;
margin-top:20px;
display:none;
}
</style>

</head>

<body>

<div class="box">

<h1>✂ Crop Image</h1>

<p>Select an image and crop it.</p>

<input
type="file"
id="image"
class="form-control"
accept="image/*">

<img id="preview">

<div class="row mt-3">

<div class="col">
<input
type="number"
id="x"
class="form-control"
placeholder="X">
</div>

<div class="col">
<input
type="number"
id="y"
class="form-control"
placeholder="Y">
</div>

</div>

<div class="row mt-3">

<div class="col">
<input
type="number"
id="w"
class="form-control"
placeholder="Width">
</div>

<div class="col">
<input
type="number"
id="h"
class="form-control"
placeholder="Height">
</div>

</div>

<button
id="crop"
class="btn btn-primary mt-3">

Crop

</button>

<br><br>

<a
id="download"
class="btn btn-success d-none">

Download Image

</a>

<br><br>

<a href="../../index.html"
class="btn btn-secondary">

⬅ Back Home

</a>

</div>

<script>

const input=document.getElementById("image");
const preview=document.getElementById("preview");
const crop=document.getElementById("crop");
const download=document.getElementById("download");

let img=new Image();

input.onchange=function(){

const file=input.files[0];

if(!file)return;

preview.src=URL.createObjectURL(file);

preview.style.display="block";

img.src=preview.src;

}

crop.onclick=function(){

const canvas=document.createElement("canvas");

canvas.width=Number(w.value);

canvas.height=Number(h.value);

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
Number(x.value),
Number(y.value),
Number(w.value),
Number(h.value),
0,
0,
Number(w.value),
Number(h.value)
);

download.href=canvas.toDataURL("image/png");

download.download="cropped.png";

download.classList.remove("d-none");

}

</script>

</body>
</html>
