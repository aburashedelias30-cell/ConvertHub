<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remove Background - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.1);
text-align:center;
}

img{
max-width:100%;
margin-top:20px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="box">

<h1>🪄 Remove Background</h1>

<p>Upload an image</p>

<input
type="file"
id="image"
accept="image/*"
class="form-control">

<br>

<button
id="remove"
class="btn btn-primary">

Remove Background

</button>

<br><br>

<img id="preview">

</div>

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal/dist/browser.js"></script>

<script>

const btn=document.getElementById("remove");

btn.onclick=async()=>{

const file=document.getElementById("image").files[0];

if(!file){

alert("Choose image");

return;

}

const blob=await removeBackground(file);

document.getElementById("preview").src=
URL.createObjectURL(blob);

}

</script>

</body>
</html>
