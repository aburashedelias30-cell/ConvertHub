<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Enhancer - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-wand-magic-sparkles text-primary display-4 mb-2"></i>
<h2 class="fw-bold">AI Image Enhancer</h2>
<p class="text-muted">Enhance clarity, brightness, sharpness, and color saturation using intelligent canvas filters.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-image"></i>
<h5 class="fw-bold">Drag & Drop an image here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="image" accept="image/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="enhanceOptions" class="card p-3 mb-4 d-none">
<div class="row g-3">
<div class="col-md-6">
<label for="presetSelect" class="form-label fw-bold">Enhancement Preset:</label>
<select id="presetSelect" class="form-select">
<option value="auto">Auto HD AI Vivid</option>
<option value="vibrant">Vibrant Colors</option>
<option value="crisp">Ultra Sharp Clarity</option>
<option value="dramatic">Dramatic Contrast</option>
</select>
</div>
<div class="col-md-6">
<label for="sharpnessRange" class="form-label fw-bold d-flex justify-content-between">
<span>Enhancement Strength:</span>
<span id="strengthVal" class="text-primary">120%</span>
</label>
<input type="range" class="form-range" id="sharpnessRange" min="100" max="200" value="120">
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="enhance" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-wand-magic-sparkles me-2"></i> Enhance Image
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Enhanced Image
</a>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5>Enhanced Image Preview:</h5>
<img id="previewImg" class="img-fluid rounded mx-auto mt-2" style="max-height:350px; object-fit:contain;">
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "image", "fileList");

const imageInput = document.getElementById("image");
const enhanceBtn = document.getElementById("enhance");
const downloadBtn = document.getElementById("download");
const enhanceOptions = document.getElementById("enhanceOptions");
const presetSelect = document.getElementById("presetSelect");
const sharpnessRange = document.getElementById("sharpnessRange");
const strengthVal = document.getElementById("strengthVal");
const previewCard = document.getElementById("previewCard");
const previewImg = document.getElementById("previewImg");
const statusAlert = document.getElementById("statusAlert");

sharpnessRange.oninput = () => { strengthVal.innerText = sharpnessRange.value + "%"; };

imageInput.addEventListener("change", () => {
    if (imageInput.files.length === 0) return;
    enhanceOptions.classList.remove("d-none");
    enhanceBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    previewCard.classList.add("d-none");
    statusAlert.innerHTML = "";
});

enhanceBtn.onclick = () => {
    const file = imageInput.files[0];
    if (!file) return;

    enhanceBtn.disabled = true;
    enhanceBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Enhancing Image...`;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");

            const strength = parseInt(sharpnessRange.value) / 100;
            const preset = presetSelect.value;

            let filterStr = `contrast(${Math.round(110 * strength)}%) brightness(${Math.round(105 * strength)}%) saturate(${Math.round(120 * strength)}%)`;
            if (preset === "vibrant") {
                filterStr = `saturate(${Math.round(150 * strength)}%) contrast(115%)`;
            } else if (preset === "crisp") {
                filterStr = `contrast(${Math.round(130 * strength)}%) brightness(102%)`;
            } else if (preset === "dramatic") {
                filterStr = `contrast(140%) saturate(130%) brightness(95%)`;
            }

            ctx.filter = filterStr;
            ctx.drawImage(img, 0, 0);

            const resultUrl = canvas.toDataURL(file.type || "image/png", 0.95);

            previewImg.src = resultUrl;
            previewCard.classList.remove("d-none");

            downloadBtn.href = resultUrl;
            downloadBtn.download = "enhanced_" + file.name;
            downloadBtn.classList.remove("d-none");

            statusAlert.innerHTML = `<div class="alert alert-success">Image enhanced successfully!</div>`;
            enhanceBtn.disabled = false;
            enhanceBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles me-2"></i> Enhance Image`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
