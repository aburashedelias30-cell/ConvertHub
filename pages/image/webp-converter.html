<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEBP Converter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-file-code text-primary display-4 mb-2"></i>
<h2 class="fw-bold">WEBP Converter</h2>
<p class="text-muted">Convert WEBP images to PNG/JPG or convert JPG/PNG into high-efficiency WEBP format.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-image"></i>
<h5 class="fw-bold">Drag & Drop image file here</h5>
<p class="text-muted small">or click to browse WEBP, PNG, JPG</p>
<input type="file" id="image" accept="image/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="formatOptions" class="card p-3 mb-4 d-none">
<label for="targetFormat" class="form-label fw-bold">Target Export Format:</label>
<select id="targetFormat" class="form-select">
<option value="image/webp">WEBP Format (.webp)</option>
<option value="image/png">PNG Format (.png)</option>
<option value="image/jpeg">JPG Format (.jpg)</option>
</select>
</div>

<div class="d-grid gap-2">
<button id="convert" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-repeat me-2"></i> Convert Image
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Converted File
</a>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5>Converted Result Preview:</h5>
<img id="previewImg" class="img-fluid rounded mx-auto mt-2" style="max-height:300px; object-fit:contain;">
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "image", "fileList");

const imageInput = document.getElementById("image");
const convertBtn = document.getElementById("convert");
const downloadBtn = document.getElementById("download");
const formatOptions = document.getElementById("formatOptions");
const targetFormat = document.getElementById("targetFormat");
const previewCard = document.getElementById("previewCard");
const previewImg = document.getElementById("previewImg");
const statusAlert = document.getElementById("statusAlert");

imageInput.addEventListener("change", () => {
    if (imageInput.files.length === 0) return;
    formatOptions.classList.remove("d-none");
    convertBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    previewCard.classList.add("d-none");
    statusAlert.innerHTML = "";
});

convertBtn.onclick = () => {
    const file = imageInput.files[0];
    if (!file) return;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Converting...`;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");

            const mime = targetFormat.value;
            if (mime === "image/jpeg") {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(img, 0, 0);

            const convertedUrl = canvas.toDataURL(mime, 0.9);

            previewImg.src = convertedUrl;
            previewCard.classList.remove("d-none");

            let ext = "webp";
            if (mime === "image/png") ext = "png";
            if (mime === "image/jpeg") ext = "jpg";

            downloadBtn.href = convertedUrl;
            downloadBtn.download = file.name.replace(/\.[^/.]+$/, "") + "." + ext;
            downloadBtn.classList.remove("d-none");

            statusAlert.innerHTML = `<div class="alert alert-success">Successfully converted to ${ext.toUpperCase()} format!</div>`;
            convertBtn.disabled = false;
            convertBtn.innerHTML = `<i class="fa-solid fa-repeat me-2"></i> Convert Image`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
