<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-lock-open text-danger display-4 mb-2"></i>
<h2 class="fw-bold">Unlock PDF File</h2>
<p class="text-muted">Remove password protection and restrictions from your PDF document.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-pdf"></i>
<h5 class="fw-bold">Drag & Drop password-protected PDF here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="pdf" accept=".pdf" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div class="card p-3 mb-4">
<label for="password" class="form-label fw-bold">Enter Document Password:</label>
<div class="input-group">
<input type="password" id="password" class="form-control" placeholder="Enter current PDF password">
<button class="btn btn-outline-secondary" type="button" id="togglePass"><i class="fa-solid fa-eye"></i></button>
</div>
</div>

<div class="d-grid gap-2">
<button id="unlock" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-unlock me-2"></i> Unlock PDF
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Unlocked PDF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "pdf", "fileList");

const fileInput = document.getElementById("pdf");
const unlockBtn = document.getElementById("unlock");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");
const passwordInput = document.getElementById("password");
const togglePass = document.getElementById("togglePass");

togglePass.onclick = () => {
    const isPass = passwordInput.type === "password";
    passwordInput.type = isPass ? "text" : "password";
    togglePass.innerHTML = isPass ? `<i class="fa-solid fa-eye-slash"></i>` : `<i class="fa-solid fa-eye"></i>`;
};

fileInput.addEventListener("change", () => {
    unlockBtn.disabled = fileInput.files.length === 0;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

unlockBtn.onclick = async () => {
    const file = fileInput.files[0];
    const password = passwordInput.value;
    if (!file) return;

    unlockBtn.disabled = true;
    unlockBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Unlocking PDF...`;
    statusAlert.innerHTML = "";

    const formData = new FormData();
    formData.append("pdf", file);
    formData.append("password", password);

    try {
        const res = await fetch("/unlock", {
            method: "POST",
            body: formData
        });

        if (!res.ok) throw new Error("Incorrect password or unlock failed.");

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        downloadBtn.href = url;
        downloadBtn.download = "unlocked_" + file.name;
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">PDF Unlocked successfully! Click download below.</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
    } finally {
        unlockBtn.disabled = false;
        unlockBtn.innerHTML = `<i class="fa-solid fa-unlock me-2"></i> Unlock PDF`;
    }
};
</script>
</body>
</html>
