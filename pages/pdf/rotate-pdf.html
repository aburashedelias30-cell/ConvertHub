<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotate PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-rotate text-danger display-4 mb-2"></i>
<h2 class="fw-bold">Rotate PDF Pages</h2>
<p class="text-muted">Rotate all pages in your PDF document clockwise or counterclockwise.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-pdf"></i>
<h5 class="fw-bold">Drag & Drop a PDF file here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="pdf" accept=".pdf" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div class="card p-3 mb-4">
<label for="angle" class="form-label fw-bold">Select Rotation Angle:</label>
<select id="angle" class="form-select">
<option value="90">90° Clockwise</option>
<option value="180">180° Upside Down</option>
<option value="270">270° Counter-Clockwise</option>
</select>
</div>

<div class="d-grid gap-2">
<button id="rotate" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-rotate me-2"></i> Rotate PDF
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Rotated PDF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "pdf", "fileList");

const fileInput = document.getElementById("pdf");
const rotateBtn = document.getElementById("rotate");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");

fileInput.addEventListener("change", () => {
    rotateBtn.disabled = fileInput.files.length === 0;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

rotateBtn.onclick = async () => {
    const file = fileInput.files[0];
    if (!file) return;

    rotateBtn.disabled = true;
    rotateBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Rotating...`;
    statusAlert.innerHTML = "";

    try {
        const angle = parseInt(document.getElementById("angle").value);
        const bytes = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });

        pdf.getPages().forEach(page => {
            const currentRotation = page.getRotation().angle;
            page.setRotation(PDFLib.degrees((currentRotation + angle) % 360));
        });

        const newBytes = await pdf.save();
        const blob = new Blob([newBytes], { type: "application/pdf" });

        downloadBtn.href = URL.createObjectURL(blob);
        downloadBtn.download = "rotated_" + file.name;
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">PDF rotated successfully! Click download below.</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error rotating PDF: ${err.message}</div>`;
    } finally {
        rotateBtn.disabled = false;
        rotateBtn.innerHTML = `<i class="fa-solid fa-rotate me-2"></i> Rotate PDF`;
    }
};
</script>
</body>
</html>
