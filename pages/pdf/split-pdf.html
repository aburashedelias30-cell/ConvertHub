<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-scissors text-danger display-4 mb-2"></i>
<h2 class="fw-bold">Split & Extract PDF Pages</h2>
<p class="text-muted">Select specific page numbers or ranges (e.g. 1, 3-5) to extract from your PDF.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-pdf"></i>
<h5 class="fw-bold">Drag & Drop a PDF file here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="pdf" accept=".pdf" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="splitOptions" class="card p-3 mb-4 d-none">
<label for="pageRange" class="form-label fw-bold">Page Selection Range:</label>
<input type="text" id="pageRange" class="form-control mb-2" placeholder="e.g., 1 or 2-4 or 1,3,5">
<div class="form-text" id="pageCountInfo"></div>
</div>

<div class="d-grid gap-2">
<button id="split" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-scissors me-2"></i> Extract Pages
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Extracted PDF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "pdf", "fileList");

const fileInput = document.getElementById("pdf");
const splitBtn = document.getElementById("split");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");
const splitOptions = document.getElementById("splitOptions");
const pageCountInfo = document.getElementById("pageCountInfo");

let loadedPdf = null;
let totalPages = 0;

fileInput.addEventListener("change", async () => {
    if (fileInput.files.length === 0) return;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";

    try {
        const file = fileInput.files[0];
        const bytes = await file.arrayBuffer();
        loadedPdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
        totalPages = loadedPdf.getPageCount();

        pageCountInfo.innerText = `Total pages in document: ${totalPages}. Enter individual pages or ranges like 1-${Math.min(totalPages, 5)}.`;
        splitOptions.classList.remove("d-none");
        splitBtn.disabled = false;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error reading PDF: ${err.message}</div>`;
    }
});

splitBtn.onclick = async () => {
    if (!loadedPdf) return;
    const rangeStr = document.getElementById("pageRange").value.trim();
    if (!rangeStr) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please enter a page number or range.</div>`;
        return;
    }

    // Parse ranges e.g. "1, 2-4" -> 0-indexed indices [0, 1, 2, 3]
    const indices = new Set();
    const parts = rangeStr.split(",");
    for (const part of parts) {
        if (part.includes("-")) {
            const [start, end] = part.split("-").map(n => parseInt(n.trim()));
            if (!isNaN(start) && !isNaN(end)) {
                for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                    if (i >= 1 && i <= totalPages) indices.add(i - 1);
                }
            }
        } else {
            const num = parseInt(part.trim());
            if (!isNaN(num) && num >= 1 && num <= totalPages) {
                indices.add(num - 1);
            }
        }
    }

    if (indices.size === 0) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Invalid page numbers entered. Total pages available: 1 to ${totalPages}.</div>`;
        return;
    }

    splitBtn.disabled = true;
    splitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Extracting...`;

    try {
        const newPdf = await PDFLib.PDFDocument.create();
        const copiedPages = await newPdf.copyPages(loadedPdf, Array.from(indices).sort((a,b)=>a-b));
        copiedPages.forEach(p => newPdf.addPage(p));

        const newBytes = await newPdf.save();
        const blob = new Blob([newBytes], { type: "application/pdf" });

        downloadBtn.href = URL.createObjectURL(blob);
        downloadBtn.download = "extracted_pages.pdf";
        downloadBtn.classList.remove("d-none");
        statusAlert.innerHTML = `<div class="alert alert-success">Successfully extracted ${indices.size} page(s)! Click download below.</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Extraction error: ${err.message}</div>`;
    } finally {
        splitBtn.disabled = false;
        splitBtn.innerHTML = `<i class="fa-solid fa-scissors me-2"></i> Extract Pages`;
    }
};
</script>
</body>
</html>
