<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to JPG - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-file-export text-danger display-4 mb-2"></i>
<h2 class="fw-bold">PDF to JPG Converter</h2>
<p class="text-muted">Convert each page of your PDF file into high-quality JPG images.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-pdf"></i>
<h5 class="fw-bold">Drag & Drop a PDF file here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="pdf" accept=".pdf" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div class="d-grid gap-2">
<button id="convert" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-image me-2"></i> Convert PDF to JPG
</button>
</div>

<div id="previewContainer" class="mt-4 row g-3"></div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

setupDropzone("dropzone", "pdf", "fileList");

const fileInput = document.getElementById("pdf");
const convertBtn = document.getElementById("convert");
const previewContainer = document.getElementById("previewContainer");
const statusAlert = document.getElementById("statusAlert");

fileInput.addEventListener("change", () => {
    convertBtn.disabled = fileInput.files.length === 0;
    previewContainer.innerHTML = "";
    statusAlert.innerHTML = "";
});

convertBtn.onclick = async () => {
    const file = fileInput.files[0];
    if (!file) return;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Rendering Pages...`;
    previewContainer.innerHTML = "";
    statusAlert.innerHTML = "";

    try {
        const bytes = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        const pageCount = pdf.numPages;

        statusAlert.innerHTML = `<div class="alert alert-info">Rendering ${pageCount} page(s)...</div>`;

        for (let i = 1; i <= pageCount; i++) {
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            const imgUrl = canvas.toDataURL("image/jpeg", 0.95);

            const col = document.createElement("div");
            col.className = "col-md-6 text-center";
            col.innerHTML = `
                <div class="card p-2 shadow-sm">
                    <img src="${imgUrl}" class="img-fluid rounded mb-2" style="max-height: 350px; object-fit: contain;">
                    <div class="d-flex justify-content-between align-items-center px-2">
                        <span class="fw-bold">Page ${i}</span>
                        <a href="${imgUrl}" download="page_${i}.jpg" class="btn btn-sm btn-success rounded-pill">
                            <i class="fa-solid fa-download me-1"></i> Download JPG
                        </a>
                    </div>
                </div>
            `;
            previewContainer.appendChild(col);
        }

        statusAlert.innerHTML = `<div class="alert alert-success">Successfully rendered all ${pageCount} pages! Click download under each page image.</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error converting PDF: ${err.message}</div>`;
    } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="fa-solid fa-image me-2"></i> Convert PDF to JPG`;
    }
};
</script>
</body>
</html>
