<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JPG to PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>

body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h1>🖼️ JPG → PDF</h1>

<p>Convert images into a PDF file.</p>


<input 
type="file"
id="images"
class="form-control"
accept="image/jpeg,image/png"
multiple>


<br>

<button id="convert" class="btn btn-primary">
Convert to PDF
</button>


<br><br>


<a id="download" class="btn btn-success d-none">
Download PDF
</a>


<br><br>


<a href="../../index.html" class="btn btn-secondary">
⬅ Back Home
</a>


</div>


<script>

const button=document.getElementById("convert");
const download=document.getElementById("download");


button.onclick=async()=>{


const files=document.getElementById("images").files;


if(files.length===0){

alert("Choose images first");

return;

}


const pdfDoc = await PDFLib.PDFDocument.create();


for(const file of files){


const bytes = await file.arrayBuffer();


let image;


if(file.type==="image/png"){

image = await pdfDoc.embedPng(bytes);

}else{

image = await pdfDoc.embedJpg(bytes);

}


const page = pdfDoc.addPage(
[
image.width,
image.height
]
);


page.drawImage(image,{

x:0,
y:0,
width:image.width,
height:image.height

});


}


const pdfBytes = await pdfDoc.save();


const blob = new Blob(
[pdfBytes],
{type:"application/pdf"}
);


download.href=URL.createObjectURL(blob);

download.download="images.pdf";

download.classList.remove("d-none");


}


</script>


</body>

</html>
