<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-object-group text-danger display-4 mb-2"></i>
<h2 class="fw-bold">Merge PDF Files</h2>
<p class="text-muted">Combine multiple PDF documents into a single unified PDF file in seconds.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-cloud-arrow-up"></i>
<h5 class="fw-bold">Drag & Drop PDF files here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="files" accept=".pdf" multiple class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div class="d-grid gap-2">
<button id="merge" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-layer-group me-2"></i> Merge PDFs
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Merged PDF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "files", "fileList");

const filesInput = document.getElementById("files");
const mergeBtn = document.getElementById("merge");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");

filesInput.addEventListener("change", () => {
    mergeBtn.disabled = filesInput.files.length < 2;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
    if (filesInput.files.length === 1) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please select at least 2 PDF files to merge.</div>`;
    }
});

mergeBtn.onclick = async () => {
    const files = filesInput.files;
    if (files.length < 2) return;

    mergeBtn.disabled = true;
    mergeBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Merging PDFs...`;
    statusAlert.innerHTML = "";

    try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const file of files) {
            const bytes = await file.arrayBuffer();
            const pdf = await PDFLib.PDFDocument.load(bytes);
            const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
            copiedPages.forEach(page => mergedPdf.addPage(page));
        }

        const mergedBytes = await mergedPdf.save();
        const blob = new Blob([mergedBytes], { type: "application/pdf" });

        downloadBtn.href = URL.createObjectURL(blob);
        downloadBtn.download = "merged_doc.pdf";
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">PDFs merged successfully! Click download below.</div>`;
    } catch (err) {
        console.error(err);
        statusAlert.innerHTML = `<div class="alert alert-danger">Error merging PDFs: ${err.message}</div>`;
    } finally {
        mergeBtn.disabled = false;
        mergeBtn.innerHTML = `<i class="fa-solid fa-layer-group me-2"></i> Merge PDFs`;
    }
};
</script>
</body>
</html>
