<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word to PDF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-file-pdf text-danger display-4 mb-2"></i>
<h2 class="fw-bold">Word to PDF Converter</h2>
<p class="text-muted">Convert DOC and DOCX Word documents into PDF documents instantly.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-word text-primary"></i>
<h5 class="fw-bold">Drag & Drop Word file (.docx, .doc) here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="doc" accept=".doc,.docx" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div class="d-grid gap-2">
<button id="convert" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-file-pdf me-2"></i> Convert to PDF
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download PDF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "doc", "fileList");

const fileInput = document.getElementById("doc");
const convertBtn = document.getElementById("convert");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");

fileInput.addEventListener("change", () => {
    convertBtn.disabled = fileInput.files.length === 0;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

convertBtn.onclick = async () => {
    const file = fileInput.files[0];
    if (!file) return;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Converting Word to PDF...`;
    statusAlert.innerHTML = "";

    const formData = new FormData();
    formData.append("doc", file);

    try {
        const res = await fetch("/word-to-pdf", {
            method: "POST",
            body: formData
        });

        if (!res.ok) throw new Error("Server conversion failed");

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        downloadBtn.href = url;
        downloadBtn.download = file.name.replace(/\.(docx|doc)$/i, "") + ".pdf";
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">Successfully converted Word document to PDF!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Conversion failed: ${err.message}</div>`;
    } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="fa-solid fa-file-pdf me-2"></i> Convert to PDF`;
    }
};
</script>
</body>
</html>
