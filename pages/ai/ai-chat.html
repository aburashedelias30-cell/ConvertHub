<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Assistant - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5" style="max-width: 900px;">
<div class="text-center mb-4">
<i class="fa-solid fa-comments text-info display-4 mb-2"></i>
<h2 class="fw-bold">AI Chat Assistant</h2>
<p class="text-muted">Ask questions, brainstorm ideas, write content, or solve complex tasks with AI.</p>
</div>

<div class="card p-3 mb-3 shadow-sm" style="height: 400px; overflow-y: auto;" id="chatBox">
<div class="d-flex gap-3 mb-3">
<div class="bg-primary text-white rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
<i class="fa-solid fa-robot"></i>
</div>
<div class="p-3 bg-light rounded-3 text-start flex-grow-1">
Hello! I am your ConvertHub AI Assistant. How can I help you today?
</div>
</div>
</div>

<div class="input-group input-group-lg">
<textarea id="userInput" class="form-control" rows="2" placeholder="Type your message here... (Press Enter to send)"></textarea>
<button id="sendBtn" class="btn btn-primary px-4 fw-bold">
<i class="fa-solid fa-paper-plane me-2"></i> Send
</button>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const statusAlert = document.getElementById("statusAlert");

let conversationHistory = [];

userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
    }
});

sendBtn.onclick = sendMsg;

async function sendMsg() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMsg("user", text);
    userInput.value = "";
    sendBtn.disabled = true;
    sendBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>...`;

    try {
        const response = await fetch("/api/ai/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                prompt: text,
                systemInstruction: "You are a helpful, intelligent AI assistant on ConvertHub."
            })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Failed to get AI response");

        appendMsg("ai", data.text);
    } catch (err) {
        appendMsg("ai", `Sorry, I encountered an error: ${err.message}`);
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = `<i class="fa-solid fa-paper-plane me-2"></i> Send`;
    }
}

function appendMsg(sender, text) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "d-flex gap-3 mb-3";

    if (sender === "user") {
        msgDiv.innerHTML = `
            <div class="ms-auto p-3 bg-primary text-white rounded-3 text-start max-w-75">
                ${escapeHtml(text)}
            </div>
            <div class="bg-secondary text-white rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="fa-solid fa-user"></i>
            </div>
        `;
    } else {
        msgDiv.innerHTML = `
            <div class="bg-primary text-white rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="p-3 bg-light rounded-3 text-start flex-grow-1" style="white-space: pre-wrap;">
                ${escapeHtml(text)}
            </div>
        `;
    }

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
</body>
</html>
