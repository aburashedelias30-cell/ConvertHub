<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Writer - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-pen-nib text-info display-4 mb-2"></i>
<h2 class="fw-bold">AI Copywriter & Article Generator</h2>
<p class="text-muted">Generate blog articles, emails, stories, essays, and social media captions instantly.</p>
</div>

<div class="card p-3 mb-4">
<div class="mb-3">
<label for="topic" class="form-label fw-bold">Topic / Prompt:</label>
<textarea id="topic" class="form-control" rows="3" placeholder="Describe what you want the AI to write about..."></textarea>
</div>
<div class="row g-3">
<div class="col-md-6">
<label for="type" class="form-label fw-bold">Content Type:</label>
<select id="type" class="form-select">
<option value="Blog Article">Blog Article</option>
<option value="Professional Email">Professional Email</option>
<option value="Social Media Post">Social Media Post</option>
<option value="Essay / Academic">Essay / Academic</option>
<option value="Creative Story">Creative Story</option>
</select>
</div>
<div class="col-md-6">
<label for="tone" class="form-label fw-bold">Tone of Voice:</label>
<select id="tone" class="form-select">
<option value="Professional & Clear">Professional & Clear</option>
<option value="Casual & Friendly">Casual & Friendly</option>
<option value="Persuasive & Engaging">Persuasive & Engaging</option>
<option value="Informative & Formal">Informative & Formal</option>
</select>
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="generate" class="btn btn-primary btn-lg rounded-pill fw-bold">
<i class="fa-solid fa-wand-magic-sparkles me-2"></i> Generate Content
</button>
</div>

<div id="resultCard" class="card p-4 mt-4 d-none">
<div class="d-flex justify-content-between align-items-center mb-3">
<h5 class="fw-bold mb-0">Generated Output:</h5>
<button id="copyBtn" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fa-solid fa-copy me-1"></i> Copy Text</button>
</div>
<div id="outputText" class="p-3 bg-light rounded-3" style="white-space: pre-wrap; font-size: 1.05rem;"></div>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const topicInput = document.getElementById("topic");
const typeSelect = document.getElementById("type");
const toneSelect = document.getElementById("tone");
const generateBtn = document.getElementById("generate");
const resultCard = document.getElementById("resultCard");
const outputText = document.getElementById("outputText");
const copyBtn = document.getElementById("copyBtn");
const statusAlert = document.getElementById("statusAlert");

generateBtn.onclick = async () => {
    const topic = topicInput.value.trim();
    if (!topic) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please enter a topic or prompt.</div>`;
        return;
    }

    generateBtn.disabled = true;
    generateBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Writing...`;
    statusAlert.innerHTML = "";

    const prompt = `Write a ${typeSelect.value} about: "${topic}". Tone should be ${toneSelect.value}. Make it well-structured and engaging.`;

    try {
        const res = await fetch("/api/ai/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Generation failed");

        outputText.innerText = data.text;
        resultCard.classList.remove("d-none");
        statusAlert.innerHTML = `<div class="alert alert-success">Content generated successfully!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
    } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles me-2"></i> Generate Content`;
    }
};

copyBtn.onclick = () => {
    navigator.clipboard.writeText(outputText.innerText);
    copyBtn.innerHTML = `<i class="fa-solid fa-check me-1"></i> Copied!`;
    setTimeout(() => { copyBtn.innerHTML = `<i class="fa-solid fa-copy me-1"></i> Copy Text`; }, 2000);
};
</script>
</body>
</html>
