<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Text Summarizer - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-align-left text-info display-4 mb-2"></i>
<h2 class="fw-bold">AI Document & Text Summarizer</h2>
<p class="text-muted">Turn long articles, reports, or transcripts into key bullet points and executive summaries.</p>
</div>

<div class="card p-3 mb-4">
<div class="mb-3">
<label for="inputText" class="form-label fw-bold">Text to Summarize:</label>
<textarea id="inputText" class="form-control" rows="6" placeholder="Paste long article, essay, notes, or transcript here..."></textarea>
</div>
<div class="row g-3">
<div class="col-md-6">
<label for="formatSelect" class="form-label fw-bold">Summary Format:</label>
<select id="formatSelect" class="form-select">
<option value="Bullet Points">Key Bullet Points</option>
<option value="Executive Summary">Executive Brief Paragraph</option>
<option value="Action Items">Action Items & Next Steps</option>
<option value="One Line Summary">TL;DR (One Sentence)</option>
</select>
</div>
<div class="col-md-6 d-flex align-items-end">
<button id="summarizeBtn" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold">
<i class="fa-solid fa-compress-alt me-2"></i> Summarize Now
</button>
</div>
</div>
</div>

<div id="resultCard" class="card p-4 mt-4 d-none">
<div class="d-flex justify-content-between align-items-center mb-3">
<h5 class="fw-bold mb-0">Summary Output:</h5>
<button id="copyBtn" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fa-solid fa-copy me-1"></i> Copy</button>
</div>
<div id="outputText" class="p-3 bg-light rounded-3" style="white-space: pre-wrap; font-size: 1.05rem;"></div>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const inputText = document.getElementById("inputText");
const formatSelect = document.getElementById("formatSelect");
const summarizeBtn = document.getElementById("summarizeBtn");
const resultCard = document.getElementById("resultCard");
const outputText = document.getElementById("outputText");
const copyBtn = document.getElementById("copyBtn");
const statusAlert = document.getElementById("statusAlert");

summarizeBtn.onclick = async () => {
    const text = inputText.value.trim();
    if (!text) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please paste or type text to summarize.</div>`;
        return;
    }

    summarizeBtn.disabled = true;
    summarizeBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Summarizing...`;
    statusAlert.innerHTML = "";

    const prompt = `Summarize the following text into ${formatSelect.value}:\n\n${text}`;

    try {
        const res = await fetch("/api/ai/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Summarization failed");

        outputText.innerText = data.text;
        resultCard.classList.remove("d-none");
        statusAlert.innerHTML = `<div class="alert alert-success">Summary created successfully!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
    } finally {
        summarizeBtn.disabled = false;
        summarizeBtn.innerHTML = `<i class="fa-solid fa-compress-alt me-2"></i> Summarize Now`;
    }
};

copyBtn.onclick = () => {
    navigator.clipboard.writeText(outputText.innerText);
    copyBtn.innerHTML = `<i class="fa-solid fa-check me-1"></i> Copied!`;
    setTimeout(() => { copyBtn.innerHTML = `<i class="fa-solid fa-copy me-1"></i> Copy`; }, 2000);
};
</script>
</body>
</html>
