<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Counter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}
</style>

</head>
<body>

<div class="box">

<h1 class="text-center">📝 Text Counter</h1>

<p class="text-center">Count characters and words.</p>

<textarea
id="text"
class="form-control"
rows="10"
placeholder="Type or paste your text..."></textarea>

<div class="mt-4">

<h5>Characters: <span id="chars">0</span></h5>

<h5>Words: <span id="words">0</span></h5>

<h5>Lines: <span id="lines">0</span></h5>

</div>

<br>

<a href="../../index.html" class="btn btn-secondary">
⬅ Back Home
</a>

</div>

<script>

const text=document.getElementById("text");

text.oninput=function(){

const value=this.value;

document.getElementById("chars").innerHTML=value.length;

const words=value.trim()==""?0:value.trim().split(/\s+/).length;

document.getElementById("words").innerHTML=words;

document.getElementById("lines").innerHTML=value==""?0:value.split("\n").length;

}

</script>

</body>
</html>
