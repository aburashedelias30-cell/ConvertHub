<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-qrcode text-success display-4 mb-2"></i>
<h2 class="fw-bold">QR Code Generator</h2>
<p class="text-muted">Generate high-resolution QR codes for websites, Wi-Fi networks, or text messages.</p>
</div>

<div class="card p-4 mb-4">
<div class="mb-3">
<label for="qrInput" class="form-label fw-bold">Enter URL or Text:</label>
<textarea id="qrInput" class="form-control" rows="3" placeholder="e.g. https://example.com or any text message"></textarea>
</div>
<div class="row g-3">
<div class="col-md-6">
<label for="fgColor" class="form-label fw-bold">Foreground Color:</label>
<input type="color" id="fgColor" class="form-control form-control-color w-100" value="#000000">
</div>
<div class="col-md-6">
<label for="bgColor" class="form-label fw-bold">Background Color:</label>
<input type="color" id="bgColor" class="form-control form-control-color w-100" value="#ffffff">
</div>
</div>
</div>

<div id="qrCard" class="card p-4 text-center mb-4 d-none">
<div id="qrcode" class="d-flex justify-content-center mb-3"></div>
<a id="downloadBtn" class="btn btn-success btn-lg rounded-pill fw-bold">
<i class="fa-solid fa-download me-2"></i> Download QR Code Image
</a>
</div>

<div class="d-grid gap-2">
<button id="generateBtn" class="btn btn-primary btn-lg rounded-pill fw-bold">
<i class="fa-solid fa-qrcode me-2"></i> Generate QR Code
</button>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const qrInput = document.getElementById("qrInput");
const fgColor = document.getElementById("fgColor");
const bgColor = document.getElementById("bgColor");
const generateBtn = document.getElementById("generateBtn");
const qrCard = document.getElementById("qrCard");
const qrcodeDiv = document.getElementById("qrcode");
const downloadBtn = document.getElementById("downloadBtn");
const statusAlert = document.getElementById("statusAlert");

let qrcodeObj = null;

generateBtn.onclick = () => {
    const text = qrInput.value.trim();
    if (!text) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please enter a URL or text to generate a QR code.</div>`;
        return;
    }

    qrcodeDiv.innerHTML = "";
    qrcodeObj = new QRCode(qrcodeDiv, {
        text: text,
        width: 220,
        height: 220,
        colorDark: fgColor.value,
        colorLight: bgColor.value,
        correctLevel: QRCode.CorrectLevel.H
    });

    qrCard.classList.remove("d-none");
    statusAlert.innerHTML = `<div class="alert alert-success">QR Code generated successfully!</div>`;

    setTimeout(() => {
        const img = qrcodeDiv.querySelector("img");
        if (img) {
            downloadBtn.href = img.src;
            downloadBtn.download = "qrcode.png";
        }
    }, 300);
};
</script>
</body>
</html>
