<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-key text-success display-4 mb-2"></i>
<h2 class="fw-bold">Random Password Generator</h2>
<p class="text-muted">Create strong, cryptographically secure passwords to protect your online accounts.</p>
</div>

<div class="card p-4 mb-4">
<div class="input-group input-group-lg mb-3">
<input type="text" id="passDisplay" class="form-control font-monospace fw-bold fs-4 text-center bg-light" readonly>
<button id="copyBtn" class="btn btn-primary"><i class="fa-solid fa-copy me-1"></i> Copy</button>
</div>

<div class="mb-3">
<label for="lengthRange" class="form-label fw-bold d-flex justify-content-between">
<span>Password Length:</span>
<span id="lengthVal" class="text-primary fs-5">16 characters</span>
</label>
<input type="range" class="form-range" id="lengthRange" min="8" max="64" value="16">
</div>

<div class="row g-2 mb-3">
<div class="col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="chkUpper" checked>
<label class="form-check-label fw-semibold" for="chkUpper">Uppercase (A-Z)</label>
</div>
</div>
<div class="col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="chkLower" checked>
<label class="form-check-label fw-semibold" for="chkLower">Lowercase (a-z)</label>
</div>
</div>
<div class="col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="chkNum" checked>
<label class="form-check-label fw-semibold" for="chkNum">Numbers (0-9)</label>
</div>
</div>
<div class="col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="chkSym" checked>
<label class="form-check-label fw-semibold" for="chkSym">Symbols (!@#$%^&*)</label>
</div>
</div>
</div>

<div class="progress mb-2" style="height: 10px;">
<div id="strengthBar" class="progress-bar bg-success" role="progressbar" style="width: 100%;"></div>
</div>
<p class="text-muted small text-center" id="strengthText">Security Strength: Very Strong</p>
</div>

<div class="d-grid gap-2">
<button id="generateBtn" class="btn btn-success btn-lg rounded-pill fw-bold">
<i class="fa-solid fa-arrows-rotate me-2"></i> Generate New Password
</button>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const passDisplay = document.getElementById("passDisplay");
const copyBtn = document.getElementById("copyBtn");
const lengthRange = document.getElementById("lengthRange");
const lengthVal = document.getElementById("lengthVal");
const chkUpper = document.getElementById("chkUpper");
const chkLower = document.getElementById("chkLower");
const chkNum = document.getElementById("chkNum");
const chkSym = document.getElementById("chkSym");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");
const generateBtn = document.getElementById("generateBtn");

lengthRange.oninput = () => {
    lengthVal.innerText = `${lengthRange.value} characters`;
    generatePassword();
};

[chkUpper, chkLower, chkNum, chkSym].forEach(chk => chk.onchange = generatePassword);
generateBtn.onclick = generatePassword;

function generatePassword() {
    const charsUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const charsLower = "abcdefghijklmnopqrstuvwxyz";
    const charsNum = "0123456789";
    const charsSym = "!@#$%^&*()_+-=[]{}|;:,.<>?";

    let pool = "";
    if (chkUpper.checked) pool += charsUpper;
    if (chkLower.checked) pool += charsLower;
    if (chkNum.checked) pool += charsNum;
    if (chkSym.checked) pool += charsSym;

    if (!pool) {
        passDisplay.value = "Select at least 1 option";
        return;
    }

    const len = parseInt(lengthRange.value);
    let pass = "";
    const cryptoObj = window.crypto || window.msCrypto;
    const randomVals = new Uint32Array(len);
    cryptoObj.getRandomValues(randomVals);

    for (let i = 0; i < len; i++) {
        pass += pool[randomVals[i] % pool.length];
    }

    passDisplay.value = pass;

    // Strength calculation
    if (len >= 16 && chkUpper.checked && chkLower.checked && chkNum.checked && chkSym.checked) {
        strengthBar.className = "progress-bar bg-success";
        strengthBar.style.width = "100%";
        strengthText.innerText = "Security Strength: Strong / Unhackable";
    } else if (len >= 12) {
        strengthBar.className = "progress-bar bg-info";
        strengthBar.style.width = "75%";
        strengthText.innerText = "Security Strength: Good";
    } else if (len >= 8) {
        strengthBar.className = "progress-bar bg-warning";
        strengthBar.style.width = "40%";
        strengthText.innerText = "Security Strength: Moderate";
    } else {
        strengthBar.className = "progress-bar bg-danger";
        strengthBar.style.width = "20%";
        strengthText.innerText = "Security Strength: Weak";
    }
}

copyBtn.onclick = () => {
    navigator.clipboard.writeText(passDisplay.value);
    copyBtn.innerHTML = `<i class="fa-solid fa-check me-1"></i> Copied!`;
    setTimeout(() => { copyBtn.innerHTML = `<i class="fa-solid fa-copy me-1"></i> Copy`; }, 2000);
};

generatePassword();
</script>
</body>
</html>
