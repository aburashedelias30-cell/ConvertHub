<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-palette text-success display-4 mb-2"></i>
<h2 class="fw-bold">Color Picker & Converter</h2>
<p class="text-muted">Pick colors and instantly convert between HEX, RGB, HSL, and HSV color codes.</p>
</div>

<div class="card p-4 mb-4 text-center">
<div id="colorBox" class="rounded-4 mb-4 shadow-sm" style="height: 150px; background-color: #3b82f6; transition: background 0.2s;"></div>
<input type="color" id="colorPicker" class="form-control form-control-color w-100 mb-3" value="#3b82f6" style="height: 50px;">

<div class="row g-3">
<div class="col-md-4">
<label class="form-label fw-bold">HEX Code:</label>
<div class="input-group">
<input type="text" id="hexVal" class="form-control font-monospace" readonly value="#3b82f6">
<button class="btn btn-outline-secondary copy-btn" data-target="hexVal"><i class="fa-solid fa-copy"></i></button>
</div>
</div>
<div class="col-md-4">
<label class="form-label fw-bold">RGB Code:</label>
<div class="input-group">
<input type="text" id="rgbVal" class="form-control font-monospace" readonly value="rgb(59, 130, 246)">
<button class="btn btn-outline-secondary copy-btn" data-target="rgbVal"><i class="fa-solid fa-copy"></i></button>
</div>
</div>
<div class="col-md-4">
<label class="form-label fw-bold">HSL Code:</label>
<div class="input-group">
<input type="text" id="hslVal" class="form-control font-monospace" readonly value="hsl(217, 91%, 60%)">
<button class="btn btn-outline-secondary copy-btn" data-target="hslVal"><i class="fa-solid fa-copy"></i></button>
</div>
</div>
</div>
</div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const colorPicker = document.getElementById("colorPicker");
const colorBox = document.getElementById("colorBox");
const hexVal = document.getElementById("hexVal");
const rgbVal = document.getElementById("rgbVal");
const hslVal = document.getElementById("hslVal");

colorPicker.addEventListener("input", updateColor);

function updateColor() {
    const hex = colorPicker.value;
    colorBox.style.backgroundColor = hex;
    hexVal.value = hex;

    const r = parseInt(hex.substring(1, 3), 16);
    const g = parseInt(hex.substring(3, 5), 16);
    const b = parseInt(hex.substring(5, 7), 16);

    rgbVal.value = `rgb(${r}, ${g}, ${b})`;

    const [h, s, l] = rgbToHsl(r, g, b);
    hslVal.value = `hsl(${h}, ${s}%, ${l}%)`;
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
        h = s = 0;
    } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
}

document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => {
        const inputId = btn.getAttribute("data-target");
        const val = document.getElementById(inputId).value;
        navigator.clipboard.writeText(val);
        btn.innerHTML = `<i class="fa-solid fa-check"></i>`;
        setTimeout(() => { btn.innerHTML = `<i class="fa-solid fa-copy"></i>`; }, 1500);
    };
});

updateColor();
</script>
</body>
</html>
