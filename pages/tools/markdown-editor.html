<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Live Editor - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5" style="max-width: 1000px;">
<div class="text-center mb-4">
<i class="fa-brands fa-markdown text-success display-4 mb-2"></i>
<h2 class="fw-bold">Markdown Live Editor & HTML Converter</h2>
<p class="text-muted">Write Markdown with side-by-side real-time preview and export HTML or Markdown files.</p>
</div>

<div class="row g-3 mb-4">
<div class="col-md-6">
<div class="d-flex justify-content-between align-items-center mb-2">
<label for="mdInput" class="form-label fw-bold mb-0">Markdown Input:</label>
<button id="clearBtn" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i> Clear</button>
</div>
<textarea id="mdInput" class="form-control font-monospace" rows="15" placeholder="# Type Markdown Here...&#10;&#10;* **Bold** and *Italic* text&#10;* Lists and links&#10;* Code blocks"></textarea>
</div>
<div class="col-md-6">
<div class="d-flex justify-content-between align-items-center mb-2">
<label class="form-label fw-bold mb-0">Live Rendered HTML Preview:</label>
<button id="copyHtmlBtn" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-code"></i> Copy HTML</button>
</div>
<div id="htmlPreview" class="p-3 bg-light rounded-3 border overflow-auto" style="height: 380px;"></div>
</div>
</div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const mdInput = document.getElementById("mdInput");
const htmlPreview = document.getElementById("htmlPreview");
const clearBtn = document.getElementById("clearBtn");
const copyHtmlBtn = document.getElementById("copyHtmlBtn");

mdInput.addEventListener("input", renderMarkdown);

function renderMarkdown() {
    const raw = mdInput.value;
    htmlPreview.innerHTML = marked.parse(raw);
}

clearBtn.onclick = () => {
    mdInput.value = "";
    renderMarkdown();
};

copyHtmlBtn.onclick = () => {
    navigator.clipboard.writeText(htmlPreview.innerHTML);
    copyHtmlBtn.innerHTML = `<i class="fa-solid fa-check me-1"></i> Copied!`;
    setTimeout(() => { copyHtmlBtn.innerHTML = `<i class="fa-solid fa-code"></i> Copy HTML`; }, 2000);
};

mdInput.value = `# Welcome to ConvertHub Markdown Editor\n\nThis is a **live side-by-side** markdown editor.\n\n### Features:\n- Instant preview rendering\n- Export to HTML code\n- Code blocks & tables support\n\n\`\`\`javascript\nconsole.log("Hello ConvertHub!");\n\`\`\``;
renderMarkdown();
</script>
</body>
</html>
