<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
padding:40px;
}

.box{
max-width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
text-align:center;
}
</style>

</head>
<body>

<div class="box">

<h1>📏 Unit Converter</h1>

<p>Convert between Kilometers and Miles.</p>

<input
type="number"
id="value"
class="form-control"
placeholder="Enter value">

<select id="type" class="form-select mt-3">
<option value="km-miles">Kilometers → Miles</option>
<option value="miles-km">Miles → Kilometers</option>
</select>

<button class="btn btn-primary mt-3" id="convert">
Convert
</button>

<h3 class="mt-4" id="result">Result: -</h3>

<br>

<a href="../../index.html" class="btn btn-secondary">
⬅ Back Home
</a>

</div>

<script>

document.getElementById("convert").onclick=function(){

const value=Number(document.getElementById("value").value);

const type=document.getElementById("type").value;

let result=0;

if(type=="km-miles"){
result=value*0.621371;
}else{
result=value/0.621371;
}

document.getElementById("result").innerHTML=
"Result: "+result.toFixed(2);

}

</script>

</body>
</html>
