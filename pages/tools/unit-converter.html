<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-ruler-combined text-success display-4 mb-2"></i>
<h2 class="fw-bold">Universal Unit Converter</h2>
<p class="text-muted">Convert measurements for Length, Weight, Temperature, and Volume instantly.</p>
</div>

<div class="card p-4 mb-4">
<div class="mb-3">
<label for="categorySelect" class="form-label fw-bold">Conversion Category:</label>
<select id="categorySelect" class="form-select">
<option value="length">Length (Meters, Feet, Inches, Miles, KM)</option>
<option value="weight">Weight / Mass (Kilograms, Pounds, Ounces, Grams)</option>
<option value="temp">Temperature (Celsius, Fahrenheit, Kelvin)</option>
</select>
</div>

<div class="row g-3 align-items-center">
<div class="col-md-5">
<label for="fromValue" class="form-label fw-bold">From Value:</label>
<input type="number" id="fromValue" class="form-control form-control-lg" value="1">
<select id="fromUnit" class="form-select mt-2"></select>
</div>
<div class="col-md-2 text-center pt-3">
<i class="fa-solid fa-arrow-right-arrow-left fs-3 text-primary"></i>
</div>
<div class="col-md-5">
<label for="toValue" class="form-label fw-bold">To Result:</label>
<input type="text" id="toValue" class="form-control form-control-lg bg-light fw-bold" readonly>
<select id="toUnit" class="form-select mt-2"></select>
</div>
</div>
</div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const categorySelect = document.getElementById("categorySelect");
const fromValue = document.getElementById("fromValue");
const fromUnit = document.getElementById("fromUnit");
const toValue = document.getElementById("toValue");
const toUnit = document.getElementById("toUnit");

const units = {
    length: {
        Meter: 1,
        Kilometer: 1000,
        Centimeter: 0.01,
        Millimeter: 0.001,
        Mile: 1609.34,
        Yard: 0.9144,
        Foot: 0.3048,
        Inch: 0.0254
    },
    weight: {
        Kilogram: 1,
        Gram: 0.001,
        Milligram: 0.000001,
        Pound: 0.453592,
        Ounce: 0.0283495
    }
};

categorySelect.onchange = setupUnits;
fromValue.oninput = convert;
fromUnit.onchange = convert;
toUnit.onchange = convert;

function setupUnits() {
    const cat = categorySelect.value;
    fromUnit.innerHTML = "";
    toUnit.innerHTML = "";

    if (cat === "temp") {
        ["Celsius", "Fahrenheit", "Kelvin"].forEach((u, i) => {
            fromUnit.add(new Option(u, u));
            toUnit.add(new Option(u, u));
        });
        toUnit.selectedIndex = 1;
    } else {
        Object.keys(units[cat]).forEach((u, i) => {
            fromUnit.add(new Option(u, u));
            toUnit.add(new Option(u, u));
        });
        toUnit.selectedIndex = 1;
    }
    convert();
}

function convert() {
    const cat = categorySelect.value;
    const val = parseFloat(fromValue.value);

    if (isNaN(val)) {
        toValue.value = "";
        return;
    }

    if (cat === "temp") {
        const u1 = fromUnit.value;
        const u2 = toUnit.value;
        let c = val;
        if (u1 === "Fahrenheit") c = (val - 32) * (5/9);
        if (u1 === "Kelvin") c = val - 273.15;

        let res = c;
        if (u2 === "Fahrenheit") res = c * (9/5) + 32;
        if (u2 === "Kelvin") res = c + 273.15;

        toValue.value = res.toFixed(2);
    } else {
        const map = units[cat];
        const base = val * map[fromUnit.value];
        const res = base / map[toUnit.value];
        toValue.value = res.toLocaleString(undefined, { maximumFractionDigits: 6 });
    }
}

setupUnits();
</script>
</body>
</html>
