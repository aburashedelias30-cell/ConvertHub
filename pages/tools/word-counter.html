<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5" style="max-width: 900px;">
<div class="text-center mb-4">
<i class="fa-solid fa-calculator text-success display-4 mb-2"></i>
<h2 class="fw-bold">Real-time Word & Character Counter</h2>
<p class="text-muted">Count words, characters, sentences, paragraphs, and estimate reading time live.</p>
</div>

<div class="row g-3 mb-4 text-center">
<div class="col-6 col-md-3">
<div class="card p-3 border-0 bg-primary text-white shadow-sm rounded-4">
<h3 class="fw-bold mb-0" id="wordCount">0</h3>
<small>Words</small>
</div>
</div>
<div class="col-6 col-md-3">
<div class="card p-3 border-0 bg-success text-white shadow-sm rounded-4">
<h3 class="fw-bold mb-0" id="charCount">0</h3>
<small>Characters</small>
</div>
</div>
<div class="col-6 col-md-3">
<div class="card p-3 border-0 bg-info text-white shadow-sm rounded-4">
<h3 class="fw-bold mb-0" id="sentenceCount">0</h3>
<small>Sentences</small>
</div>
</div>
<div class="col-6 col-md-3">
<div class="card p-3 border-0 bg-warning text-dark shadow-sm rounded-4">
<h3 class="fw-bold mb-0" id="readTime">0 min</h3>
<small>Read Time</small>
</div>
</div>
</div>

<div class="card p-3 mb-3">
<textarea id="textInput" class="form-control border-0 fs-5" rows="10" placeholder="Type or paste your text here to count..."></textarea>
</div>

<div class="d-flex justify-content-between align-items-center">
<button id="clearBtn" class="btn btn-outline-danger rounded-pill"><i class="fa-solid fa-trash me-1"></i> Clear Text</button>
<button id="copyBtn" class="btn btn-primary rounded-pill"><i class="fa-solid fa-copy me-1"></i> Copy Text</button>
</div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const textInput = document.getElementById("textInput");
const wordCount = document.getElementById("wordCount");
const charCount = document.getElementById("charCount");
const sentenceCount = document.getElementById("sentenceCount");
const readTime = document.getElementById("readTime");
const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");

textInput.addEventListener("input", updateCounts);

function updateCounts() {
    const text = textInput.value;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const chars = text.length;
    const sentences = text.trim() ? (text.match(/[.!?]+/g) || []).length : 0;
    const minutes = Math.ceil(words / 200);

    wordCount.innerText = words.toLocaleString();
    charCount.innerText = chars.toLocaleString();
    sentenceCount.innerText = sentences.toLocaleString();
    readTime.innerText = `${minutes} min`;
}

clearBtn.onclick = () => {
    textInput.value = "";
    updateCounts();
};

copyBtn.onclick = () => {
    if (textInput.value) {
        navigator.clipboard.writeText(textInput.value);
        copyBtn.innerHTML = `<i class="fa-solid fa-check me-1"></i> Copied!`;
        setTimeout(() => { copyBtn.innerHTML = `<i class="fa-solid fa-copy me-1"></i> Copy Text`; }, 2000);
    }
};
</script>
</body>
</html>
