<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio / MP3 Cutter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-scissors text-warning display-4 mb-2"></i>
<h2 class="fw-bold">MP3 / Audio Cutter & Trimmer</h2>
<p class="text-muted">Trim audio files precisely by selecting start and end timestamps.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-audio"></i>
<h5 class="fw-bold">Drag & Drop an audio file here</h5>
<p class="text-muted small">or click to browse MP3, WAV, OGG, M4A</p>
<input type="file" id="audio" accept="audio/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="audioControls" class="card p-3 mb-4 d-none">
<div class="mb-3 text-center">
<audio id="audioPlayer" controls class="w-100 mb-2"></audio>
<p class="text-muted small" id="durationText">Duration: 00:00</p>
</div>
<div class="row g-3">
<div class="col-md-6">
<label for="startTime" class="form-label fw-bold">Start Time (seconds):</label>
<input type="number" id="startTime" class="form-control" value="0" min="0" step="0.1">
</div>
<div class="col-md-6">
<label for="endTime" class="form-label fw-bold">End Time (seconds):</label>
<input type="number" id="endTime" class="form-control" value="10" min="0" step="0.1">
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="cutBtn" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-scissors me-2"></i> Cut Audio
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Cut Audio
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "audio", "fileList");

const audioInput = document.getElementById("audio");
const cutBtn = document.getElementById("cutBtn");
const downloadBtn = document.getElementById("download");
const audioControls = document.getElementById("audioControls");
const audioPlayer = document.getElementById("audioPlayer");
const durationText = document.getElementById("durationText");
const startTime = document.getElementById("startTime");
const endTime = document.getElementById("endTime");
const statusAlert = document.getElementById("statusAlert");

let audioBuffer = null;
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

audioInput.addEventListener("change", async () => {
    if (audioInput.files.length === 0) return;
    const file = audioInput.files[0];

    audioPlayer.src = URL.createObjectURL(file);
    audioControls.classList.remove("d-none");
    cutBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";

    const arrayBuffer = await file.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    durationText.innerText = `Total Duration: ${audioBuffer.duration.toFixed(2)} seconds`;
    startTime.value = "0";
    endTime.value = audioBuffer.duration.toFixed(1);
    endTime.max = audioBuffer.duration;
});

cutBtn.onclick = async () => {
    if (!audioBuffer) return;

    const start = parseFloat(startTime.value);
    const end = parseFloat(endTime.value);

    if (isNaN(start) || isNaN(end) || start >= end || start < 0 || end > audioBuffer.duration) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Please enter valid start and end timestamps.</div>`;
        return;
    }

    cutBtn.disabled = true;
    cutBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Trimming Audio...`;

    try {
        const sampleRate = audioBuffer.sampleRate;
        const startSample = Math.floor(start * sampleRate);
        const endSample = Math.floor(end * sampleRate);
        const frameCount = endSample - startSample;

        const cutBuffer = audioCtx.createBuffer(
            audioBuffer.numberOfChannels,
            frameCount,
            sampleRate
        );

        for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
            const channelData = audioBuffer.getChannelData(channel);
            const cutChannelData = cutBuffer.getChannelData(channel);
            for (let i = 0; i < frameCount; i++) {
                cutChannelData[i] = channelData[startSample + i];
            }
        }

        // Convert audio buffer to WAV blob
        const wavBlob = audioBufferToWav(cutBuffer);
        const url = URL.createObjectURL(wavBlob);

        downloadBtn.href = url;
        downloadBtn.download = "trimmed_" + audioInput.files[0].name.replace(/\.[^/.]+$/, ".wav");
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">Audio cut successfully (${(end - start).toFixed(2)} sec clip)!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error cutting audio: ${err.message}</div>`;
    } finally {
        cutBtn.disabled = false;
        cutBtn.innerHTML = `<i class="fa-solid fa-scissors me-2"></i> Cut Audio`;
    }
};

function audioBufferToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM
    const bitDepth = 16;
    let result;

    if (numChannels === 2) {
        result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
    } else {
        result = buffer.getChannelData(0);
    }

    return createWavBlob(result, numChannels, sampleRate, bitDepth);
}

function interleave(inputL, inputR) {
    const length = inputL.length + inputR.length;
    const result = new Float32Array(length);
    let index = 0;
    let inputIndex = 0;

    while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
    }
    return result;
}

function createWavBlob(samples, numChannels, sampleRate, bitDepth) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    /* RIFF identifier */
    writeString(view, 0, 'RIFF');
    /* RIFF chunk length */
    view.setUint32(4, 36 + samples.length * 2, true);
    /* RIFF type */
    writeString(view, 8, 'WAVE');
    /* format chunk identifier */
    writeString(view, 12, 'fmt ');
    /* format chunk length */
    view.setUint32(16, 16, true);
    /* sample format (raw) */
    view.setUint16(20, 1, true);
    /* channel count */
    view.setUint16(22, numChannels, true);
    /* sample rate */
    view.setUint32(24, sampleRate, true);
    /* byte rate (sample rate * block align) */
    view.setUint32(28, sampleRate * numChannels * 2, true);
    /* block align (channel count * bytes per sample) */
    view.setUint16(32, numChannels * 2, true);
    /* bits per sample */
    view.setUint16(34, bitDepth, true);
    /* data chunk identifier */
    writeString(view, 36, 'data');
    /* data chunk length */
    view.setUint32(40, samples.length * 2, true);

    floatTo16BitPCM(view, 44, samples);

    return new Blob([buffer], { type: 'audio/wav' });
}

function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
    }
}

function floatTo16BitPCM(output, offset, input) {
    for (let i = 0; i < input.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
}
</script>
</body>
</html>
