<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-microphone text-warning display-4 mb-2"></i>
<h2 class="fw-bold">Online Voice Recorder</h2>
<p class="text-muted">Record audio directly from your microphone with instant playback and download.</p>
</div>

<div class="card p-4 text-center mb-4">
<div class="display-3 fw-bold text-primary mb-3" id="timer">00:00</div>

<div class="d-flex justify-content-center gap-3">
<button id="recordBtn" class="btn btn-danger btn-lg rounded-pill px-4 fw-bold">
<i class="fa-solid fa-circle me-2"></i> Start Recording
</button>
<button id="stopBtn" class="btn btn-secondary btn-lg rounded-pill px-4 fw-bold" disabled>
<i class="fa-solid fa-square me-2"></i> Stop
</button>
</div>
</div>

<div id="playbackCard" class="card p-3 mb-4 d-none">
<h5 class="fw-bold mb-3">Recorded Audio Playback:</h5>
<audio id="audioPlayback" controls class="w-100 mb-3"></audio>
<a id="downloadBtn" class="btn btn-success btn-lg rounded-pill fw-bold w-100">
<i class="fa-solid fa-download me-2"></i> Download Recording
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const timer = document.getElementById("timer");
const playbackCard = document.getElementById("playbackCard");
const audioPlayback = document.getElementById("audioPlayback");
const downloadBtn = document.getElementById("downloadBtn");
const statusAlert = document.getElementById("statusAlert");

let mediaRecorder;
let audioChunks = [];
let timerInterval;
let seconds = 0;

recordBtn.onclick = async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioUrl = URL.createObjectURL(audioBlob);

            audioPlayback.src = audioUrl;
            downloadBtn.href = audioUrl;
            downloadBtn.download = `voice_recording_${Date.now()}.webm`;

            playbackCard.classList.remove("d-none");
            statusAlert.innerHTML = `<div class="alert alert-success">Recording saved successfully!</div>`;
        };

        mediaRecorder.start();
        seconds = 0;
        timer.innerText = "00:00";
        timerInterval = setInterval(() => {
            seconds++;
            const m = String(Math.floor(seconds / 60)).padStart(2, "0");
            const s = String(seconds % 60).padStart(2, "0");
            timer.innerText = `${m}:${s}`;
        }, 1000);

        recordBtn.disabled = true;
        stopBtn.disabled = false;
        statusAlert.innerHTML = `<div class="alert alert-info"><span class="spinner-grow spinner-grow-sm me-2 text-danger"></span> Recording in progress... Speak now!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Microphone access error: ${err.message}. Please allow microphone permissions.</div>`;
    }
};

stopBtn.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        clearInterval(timerInterval);

        recordBtn.disabled = false;
        stopBtn.disabled = true;
    }
};
</script>
</body>
</html>
