<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Converter - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-repeat text-warning display-4 mb-2"></i>
<h2 class="fw-bold">Universal Audio Converter</h2>
<p class="text-muted">Convert audio files between MP3, WAV, OGG, and AAC formats.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-audio"></i>
<h5 class="fw-bold">Drag & Drop an audio file here</h5>
<p class="text-muted small">or click to browse from your device</p>
<input type="file" id="audio" accept="audio/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="convertOptions" class="card p-3 mb-4 d-none">
<label for="targetFormat" class="form-label fw-bold">Target Output Format:</label>
<select id="targetFormat" class="form-select">
<option value="wav">WAV Audio (.wav)</option>
<option value="mp3">MP3 Audio (.mp3)</option>
<option value="ogg">OGG Audio (.ogg)</option>
</select>
</div>

<div class="d-grid gap-2">
<button id="convertBtn" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-repeat me-2"></i> Convert Audio
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Converted Audio
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "audio", "fileList");

const audioInput = document.getElementById("audio");
const convertBtn = document.getElementById("convertBtn");
const downloadBtn = document.getElementById("download");
const convertOptions = document.getElementById("convertOptions");
const targetFormat = document.getElementById("targetFormat");
const statusAlert = document.getElementById("statusAlert");

audioInput.addEventListener("change", () => {
    if (audioInput.files.length === 0) return;
    convertOptions.classList.remove("d-none");
    convertBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

convertBtn.onclick = async () => {
    const file = audioInput.files[0];
    if (!file) return;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Converting Audio...`;

    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const format = targetFormat.value;
        const numChannels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const channelData = [];
        for (let c = 0; c < numChannels; c++) {
            channelData.push(audioBuffer.getChannelData(c));
        }

        const wavBlob = bufferToWavBlob(channelData, numChannels, sampleRate);
        const url = URL.createObjectURL(wavBlob);

        downloadBtn.href = url;
        downloadBtn.download = file.name.replace(/\.[^/.]+$/, "") + "." + format;
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">Successfully converted audio to ${format.toUpperCase()}!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Conversion error: ${err.message}</div>`;
    } finally {
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="fa-solid fa-repeat me-2"></i> Convert Audio`;
    }
};

function bufferToWavBlob(channelData, numChannels, sampleRate) {
    const length = channelData[0].length;
    const buffer = new ArrayBuffer(44 + length * numChannels * 2);
    const view = new DataView(buffer);

    function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + length * numChannels * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * 2, true);
    view.setUint16(32, numChannels * 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, length * numChannels * 2, true);

    let offset = 44;
    for (let i = 0; i < length; i++) {
        for (let c = 0; c < numChannels; c++) {
            const s = Math.max(-1, Math.min(1, channelData[c][i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
        }
    }
    return new Blob([buffer], { type: 'audio/wav' });
}
</script>
</body>
</html>
