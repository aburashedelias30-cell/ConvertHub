<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to MP3 - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-file-audio text-purple display-4 mb-2"></i>
<h2 class="fw-bold">Video to MP3 Converter</h2>
<p class="text-muted">Extract high-quality audio tracks from MP4, AVI, MOV, or WEBM video files.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-video"></i>
<h5 class="fw-bold">Drag & Drop a video file here</h5>
<p class="text-muted small">or click to browse MP4, MOV, WEBM</p>
<input type="file" id="video" accept="video/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="videoPreview" class="card p-3 mb-4 d-none text-center">
<video id="videoPlayer" controls class="w-100 rounded mb-2" style="max-height: 300px;"></video>
</div>

<div class="d-grid gap-2">
<button id="extractBtn" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-file-audio me-2"></i> Extract Audio Track
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Extracted Audio
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "video", "fileList");

const videoInput = document.getElementById("video");
const extractBtn = document.getElementById("extractBtn");
const downloadBtn = document.getElementById("download");
const videoPreview = document.getElementById("videoPreview");
const videoPlayer = document.getElementById("videoPlayer");
const statusAlert = document.getElementById("statusAlert");

videoInput.addEventListener("change", () => {
    if (videoInput.files.length === 0) return;
    const file = videoInput.files[0];
    videoPlayer.src = URL.createObjectURL(file);
    videoPreview.classList.remove("d-none");
    extractBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

extractBtn.onclick = async () => {
    const file = videoInput.files[0];
    if (!file) return;

    extractBtn.disabled = true;
    extractBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Extracting Audio Track...`;

    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const numChannels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const channelData = [];
        for (let c = 0; c < numChannels; c++) {
            channelData.push(audioBuffer.getChannelData(c));
        }

        const wavBlob = bufferToWavBlob(channelData, numChannels, sampleRate);
        const url = URL.createObjectURL(wavBlob);

        downloadBtn.href = url;
        downloadBtn.download = file.name.replace(/\.[^/.]+$/, ".wav");
        downloadBtn.classList.remove("d-none");

        statusAlert.innerHTML = `<div class="alert alert-success">Audio extracted successfully from video!</div>`;
    } catch (err) {
        statusAlert.innerHTML = `<div class="alert alert-danger">Error extracting audio: ${err.message}</div>`;
    } finally {
        extractBtn.disabled = false;
        extractBtn.innerHTML = `<i class="fa-solid fa-file-audio me-2"></i> Extract Audio Track`;
    }
};

function bufferToWavBlob(channelData, numChannels, sampleRate) {
    const length = channelData[0].length;
    const buffer = new ArrayBuffer(44 + length * numChannels * 2);
    const view = new DataView(buffer);

    function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + length * numChannels * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * 2, true);
    view.setUint16(32, numChannels * 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, length * numChannels * 2, true);

    let offset = 44;
    for (let i = 0; i < length; i++) {
        for (let c = 0; c < numChannels; c++) {
            const s = Math.max(-1, Math.min(1, channelData[c][i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
        }
    }
    return new Blob([buffer], { type: 'audio/wav' });
}
</script>
</body>
</html>
