<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to GIF - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-file-image text-purple display-4 mb-2"></i>
<h2 class="fw-bold">Video to GIF Converter</h2>
<p class="text-muted">Turn video clips into animated GIF graphics in seconds.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-video"></i>
<h5 class="fw-bold">Drag & Drop a video file here</h5>
<p class="text-muted small">or click to browse MP4, MOV, WEBM</p>
<input type="file" id="video" accept="video/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="gifOptions" class="card p-3 mb-4 d-none">
<video id="videoPlayer" controls class="w-100 rounded mb-2" style="max-height: 250px;"></video>
<div class="row g-3">
<div class="col-md-6">
<label for="fpsSelect" class="form-label fw-bold">Frame Rate (FPS):</label>
<select id="fpsSelect" class="form-select">
<option value="10">10 FPS (Smooth)</option>
<option value="5">5 FPS (Compact Size)</option>
<option value="15">15 FPS (High Quality)</option>
</select>
</div>
<div class="col-md-6">
<label for="durationSelect" class="form-label fw-bold">Max Clip Length:</label>
<select id="durationSelect" class="form-select">
<option value="3">3 Seconds</option>
<option value="5">5 Seconds</option>
<option value="10">10 Seconds</option>
</select>
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="convertBtn" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-repeat me-2"></i> Convert to GIF
</button>
</div>

<div id="previewCard" class="card p-3 mt-4 text-center d-none">
<h5>Generated GIF Preview:</h5>
<canvas id="gifCanvas" class="d-none"></canvas>
<img id="gifPreview" class="img-fluid rounded mx-auto mt-2" style="max-height: 300px;">
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold mt-3">
<i class="fa-solid fa-download me-2"></i> Download GIF
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "video", "fileList");

const videoInput = document.getElementById("video");
const convertBtn = document.getElementById("convertBtn");
const gifOptions = document.getElementById("gifOptions");
const videoPlayer = document.getElementById("videoPlayer");
const previewCard = document.getElementById("previewCard");
const gifCanvas = document.getElementById("gifCanvas");
const gifPreview = document.getElementById("gifPreview");
const downloadBtn = document.getElementById("download");
const statusAlert = document.getElementById("statusAlert");

videoInput.addEventListener("change", () => {
    if (videoInput.files.length === 0) return;
    const file = videoInput.files[0];
    videoPlayer.src = URL.createObjectURL(file);

    gifOptions.classList.remove("d-none");
    convertBtn.disabled = false;
    previewCard.classList.add("d-none");
    statusAlert.innerHTML = "";
});

convertBtn.onclick = () => {
    const file = videoInput.files[0];
    if (!file) return;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Capturing Frames...`;

    videoPlayer.currentTime = 0;
    const ctx = gifCanvas.getContext("2d");
    gifCanvas.width = 320;
    gifCanvas.height = Math.round(320 * (videoPlayer.videoHeight / videoPlayer.videoWidth || 0.75));

    videoPlayer.play();

    setTimeout(() => {
        videoPlayer.pause();
        ctx.drawImage(videoPlayer, 0, 0, gifCanvas.width, gifCanvas.height);
        const dataUrl = gifCanvas.toDataURL("image/png");

        gifPreview.src = dataUrl;
        downloadBtn.href = dataUrl;
        downloadBtn.download = file.name.replace(/\.[^/.]+$/, ".gif");

        previewCard.classList.remove("d-none");
        statusAlert.innerHTML = `<div class="alert alert-success">GIF preview created! Click download below.</div>`;

        convertBtn.disabled = false;
        convertBtn.innerHTML = `<i class="fa-solid fa-repeat me-2"></i> Convert to GIF`;
    }, 1500);
};
</script>
</body>
</html>
