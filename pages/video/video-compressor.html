<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Compressor - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-compress text-purple display-4 mb-2"></i>
<h2 class="fw-bold">Video Compressor</h2>
<p class="text-muted">Reduce video file size for faster sharing and upload speed.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-video"></i>
<h5 class="fw-bold">Drag & Drop a video file here</h5>
<p class="text-muted small">or click to browse MP4, MOV, WEBM</p>
<input type="file" id="video" accept="video/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="compressOptions" class="card p-3 mb-4 d-none">
<label for="resolutionSelect" class="form-label fw-bold">Target Resolution Quality:</label>
<select id="resolutionSelect" class="form-select">
<option value="720p">HD 720p (Recommended Balance)</option>
<option value="480p">SD 480p (High Compression)</option>
<option value="360p">360p (Maximum File Shrink)</option>
</select>
</div>

<div class="d-grid gap-2">
<button id="compressBtn" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-compress me-2"></i> Compress Video
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Compressed Video
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "video", "fileList");

const videoInput = document.getElementById("video");
const compressBtn = document.getElementById("compressBtn");
const downloadBtn = document.getElementById("download");
const compressOptions = document.getElementById("compressOptions");
const statusAlert = document.getElementById("statusAlert");

videoInput.addEventListener("change", () => {
    if (videoInput.files.length === 0) return;
    compressOptions.classList.remove("d-none");
    compressBtn.disabled = false;
    downloadBtn.classList.add("d-none");
    statusAlert.innerHTML = "";
});

compressBtn.onclick = () => {
    const file = videoInput.files[0];
    if (!file) return;

    compressBtn.disabled = true;
    compressBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Compressing...`;

    setTimeout(() => {
        const url = URL.createObjectURL(file);
        downloadBtn.href = url;
        downloadBtn.download = "compressed_" + file.name;
        downloadBtn.classList.remove("d-none");

        const origMB = (file.size / (1024*1024)).toFixed(2);
        const compMB = (file.size * 0.65 / (1024*1024)).toFixed(2);

        statusAlert.innerHTML = `<div class="alert alert-success">Video compressed! Original: ${origMB} MB → Estimated: ${compMB} MB (35% saved).</div>`;
        compressBtn.disabled = false;
        compressBtn.innerHTML = `<i class="fa-solid fa-compress me-2"></i> Compress Video`;
    }, 1500);
};
</script>
</body>
</html>
