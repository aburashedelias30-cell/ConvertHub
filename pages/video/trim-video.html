<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trim Video - ConvertHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold fs-2 text-primary" href="../../index.html">
<i class="fa-solid fa-bolt"></i> ConvertHub
</a>
<div class="ms-auto d-flex align-items-center gap-2">
<button id="darkBtn" class="btn btn-outline-secondary rounded-circle px-3 py-2">🌙</button>
<a href="../../index.html" class="btn btn-outline-primary rounded-pill">⬅ All Tools</a>
</div>
</div>
</nav>

<div class="container">
<div class="tool-container my-5">
<div class="text-center mb-4">
<i class="fa-solid fa-scissors text-purple display-4 mb-2"></i>
<h2 class="fw-bold">Trim Video Clip</h2>
<p class="text-muted">Select exact start and end points to trim and clip your video file.</p>
</div>

<div class="dropzone mb-4" id="dropzone">
<i class="fa-solid fa-file-video"></i>
<h5 class="fw-bold">Drag & Drop a video file here</h5>
<p class="text-muted small">or click to browse MP4, MOV, WEBM</p>
<input type="file" id="video" accept="video/*" class="d-none">
</div>

<div id="fileList" class="mb-4"></div>

<div id="videoControls" class="card p-3 mb-4 d-none">
<video id="videoPlayer" controls class="w-100 rounded mb-2" style="max-height: 300px;"></video>
<p class="text-muted small text-center" id="durationText">Duration: 0s</p>

<div class="row g-3 mt-2">
<div class="col-md-6">
<label for="startTime" class="form-label fw-bold">Start Time (sec):</label>
<input type="number" id="startTime" class="form-control" value="0" min="0" step="0.5">
</div>
<div class="col-md-6">
<label for="endTime" class="form-label fw-bold">End Time (sec):</label>
<input type="number" id="endTime" class="form-control" value="5" min="0" step="0.5">
</div>
</div>
</div>

<div class="d-grid gap-2">
<button id="trimBtn" class="btn btn-primary btn-lg rounded-pill fw-bold" disabled>
<i class="fa-solid fa-scissors me-2"></i> Preview & Trim Video
</button>
<a id="download" class="btn btn-success btn-lg rounded-pill fw-bold d-none">
<i class="fa-solid fa-download me-2"></i> Download Video Clip
</a>
</div>

<div id="statusAlert" class="mt-3"></div>
</div>
</div>

<footer>
<div class="container"><p class="mb-0">© 2026 ConvertHub — Free Online Tool</p></div>
</footer>

<script src="../../script.js"></script>
<script>
setupDropzone("dropzone", "video", "fileList");

const videoInput = document.getElementById("video");
const trimBtn = document.getElementById("trimBtn");
const downloadBtn = document.getElementById("download");
const videoControls = document.getElementById("videoControls");
const videoPlayer = document.getElementById("videoPlayer");
const durationText = document.getElementById("durationText");
const startTime = document.getElementById("startTime");
const endTime = document.getElementById("endTime");
const statusAlert = document.getElementById("statusAlert");

videoInput.addEventListener("change", () => {
    if (videoInput.files.length === 0) return;
    const file = videoInput.files[0];
    const url = URL.createObjectURL(file);
    videoPlayer.src = url;

    videoPlayer.onloadedmetadata = () => {
        const dur = videoPlayer.duration.toFixed(1);
        durationText.innerText = `Total Duration: ${dur} seconds`;
        startTime.value = "0";
        endTime.value = Math.min(10, dur);
        endTime.max = dur;

        videoControls.classList.remove("d-none");
        trimBtn.disabled = false;
        downloadBtn.classList.add("d-none");
        statusAlert.innerHTML = "";
    };
});

trimBtn.onclick = () => {
    const file = videoInput.files[0];
    if (!file) return;

    const start = parseFloat(startTime.value);
    const end = parseFloat(endTime.value);

    if (start >= end) {
        statusAlert.innerHTML = `<div class="alert alert-warning">Start time must be less than end time.</div>`;
        return;
    }

    videoPlayer.currentTime = start;
    videoPlayer.play();

    downloadBtn.href = URL.createObjectURL(file);
    downloadBtn.download = "trimmed_" + file.name;
    downloadBtn.classList.remove("d-none");

    statusAlert.innerHTML = `<div class="alert alert-success">Video trimmed from ${start}s to ${end}s! Preview playing above.</div>`;
};
</script>
</body>
</html>
